<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Moa 회원 관리자 페이지" />
    <title>회원 관리 | moa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-body">
    <header class="admin-header">
      <a class="brand admin-brand" href="index.html" aria-label="Moa 홈">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
        <span>moa</span>
      </a>
      <div class="admin-account">
        <span id="admin-identity">관리자 확인 중</span>
        <a href="index.html">가입 화면</a>
        <button id="admin-logout-button" type="button">로그아웃</button>
      </div>
    </header>

    <main class="admin-main">
      <section class="admin-title-row">
        <div>
          <p class="step">MEMBER ADMINISTRATION</p>
          <h1>회원 관리</h1>
          <p>가입 회원을 조회하고 계정 정보를 안전하게 관리합니다.</p>
        </div>
        <button class="secondary-button" id="refresh-button" type="button">새로고침</button>
      </section>

      <section class="stat-grid" aria-label="회원 현황">
        <article class="stat-card"><span>전체 회원</span><strong id="total-count">-</strong></article>
        <article class="stat-card"><span>활성 회원</span><strong id="active-count">-</strong></article>
        <article class="stat-card"><span>정지 회원</span><strong id="suspended-count">-</strong></article>
      </section>

      <section class="member-card">
        <div class="member-toolbar">
          <div>
            <h2>회원 목록</h2>
            <p>최대 100명의 최신 가입 회원을 표시합니다.</p>
          </div>
          <form class="member-search" id="member-search-form" role="search">
            <label class="sr-only" for="member-search">회원 검색</label>
            <input id="member-search" type="search" placeholder="이름 또는 이메일 검색" />
            <button type="submit">검색</button>
          </form>
        </div>

        <p class="admin-status" id="admin-status" role="status" aria-live="polite"></p>
        <div class="member-table-wrap">
          <table class="member-table">
            <thead>
              <tr><th>회원</th><th>상태</th><th>권한</th><th>가입일</th><th class="actions-column">관리</th></tr>
            </thead>
            <tbody id="member-table-body"></tbody>
          </table>
        </div>
        <div class="empty-state" id="member-empty-state" hidden>조건에 맞는 회원이 없습니다.</div>
      </section>
    </main>

    <dialog class="login-dialog edit-dialog" id="edit-dialog" aria-labelledby="edit-title">
      <div class="dialog-heading">
        <div><p class="step">EDIT MEMBER</p><h2 id="edit-title">회원정보 수정</h2></div>
        <button class="dialog-close" id="edit-close-button" type="button" aria-label="수정 창 닫기">×</button>
      </div>
      <form id="edit-form" novalidate>
        <input id="edit-id" type="hidden" />
        <div class="field"><label for="edit-name">이름</label><input id="edit-name" type="text" maxlength="50" required /></div>
        <div class="field"><label for="edit-email">이메일</label><input id="edit-email" type="email" maxlength="254" required /></div>
        <div class="field">
          <label for="edit-status">상태</label>
          <select id="edit-status"><option value="active">활성</option><option value="suspended">정지</option></select>
        </div>
        <p class="form-status" id="edit-status-message" role="alert" aria-live="polite"></p>
        <div class="dialog-actions"><button class="secondary-button" id="edit-cancel-button" type="button">취소</button><button class="submit-button" type="submit"><span>저장</span></button></div>
      </form>
    </dialog>

    <script src="admin.js?v=1"></script>
  </body>
</html>
